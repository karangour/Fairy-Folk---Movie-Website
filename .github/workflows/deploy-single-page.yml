name: Deploy Single-Page Branch to GitHub Pages

on:
  push:
    branches:
      - single-page
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install Dependencies
        run: |
          cd client
          npm ci
          
      - name: Build
        run: |
          cd client
          npm run build
          
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: client/dist # or client/build depending on your build output
          branch: gh-pages
          clean: true
